<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>agentflame</title>
<style>
  body { background: #1e1e1e; color: #e0e0e0; font-family: monospace; margin: 0; padding: 16px; }
  h1 { font-size: 16px; font-weight: normal; color: #9e9e9e; margin: 0 0 16px; }
  dl.stats { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0 0 16px; }
  dl.stats dt { color: #9e9e9e; }
  dl.stats dd { margin: 0; }
  #flame svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<h1>agentflame</h1>
<div id="stats">waiting for first poll...</div>
<div id="flame"></div>
<script type="module">
  import { createDashboard } from './dashboard.js';

  const statsMount = document.getElementById('stats');
  const flameMount = document.getElementById('flame');

  const dashboard = createDashboard({
    fetchTimeline: () => fetch('/api/v1/timeline').then((res) => res.json()),
    fetchFlame: () => fetch('/api/v1/flame.svg').then((res) => res.text()),
    statsMount,
    flameMount,
  });

  const POLL_MS = 1000;
  dashboard.poll();
  setInterval(() => dashboard.poll(), POLL_MS);
</script>
</body>
</html>
